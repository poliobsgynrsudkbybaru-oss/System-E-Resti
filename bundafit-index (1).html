<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunda Fit & Ready - RSUD Kebayoran Baru</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f8fafc; 
            transition: background 0.5s ease;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
        }
        /* Tampilan landscape / desktop untuk bidan */
        @media (min-width: 1024px) {
            #app.bidan-wide { max-width: 1280px !important; }
            #app.bidan-mid { max-width: 960px !important; }
            .desk-cols { display: grid; grid-template-columns: 380px 1fr; gap: 1.5rem; align-items: start; }
            .desk-cols > .desk-side { position: sticky; top: 150px; }
            .desk-cols > .desk-side > div { margin-bottom: 0 !important; }
            .desk-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; align-items: start; }
            .desk-grid > * { margin-bottom: 0 !important; }
            .desk-tabs { justify-content: center; }
            .desk-tabs > button { flex: 0 1 180px !important; }
        }
        .bg-overlay { background-color: rgba(255, 255, 255, 0.85); backdrop-filter: blur(5px); }
    </style>
</head>
<body class="text-slate-800 font-sans min-h-screen flex justify-center">

    <div id="app" class="w-full max-w-md bg-white/95 shadow-2xl relative overflow-hidden flex flex-col min-h-screen bg-overlay">
        <div class="flex-1 flex flex-col items-center justify-center p-8">
            <i class="fas fa-spinner fa-spin text-4xl text-teal-500 mb-4"></i>
            <p class="text-slate-500 font-medium">Memuat Sistem RSUD...</p>
        </div>
    </div>

    <!-- Integrasi Firebase Online -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, updateDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmymICWXWEZeP7wReAovVWQuig9ze1wAM",
            authDomain: "bunda-fit-fb9cf.firebaseapp.com",
            projectId: "bunda-fit-fb9cf",
            storageBucket: "bunda-fit-fb9cf.firebasestorage.app",
            messagingSenderId: "849481063147",
            appId: "1:849481063147:web:e693a7c866e6687fdc3cae"
        };

        const appFirebase = initializeApp(firebaseConfig);
        const firestoreDB = getFirestore(appFirebase);

        window.db = { patients: [], education: [] };
        window.appSettings = { logo: '', bg: '' };
        window.view = 'login'; 
        window.currentPatient = null;
        window.activeTab = 'riwayat'; 
        window.activeBidanTab = 'daftar'; 
        window.tempImageBase64 = null;
        window.editingVisitIndex = null;

        onSnapshot(doc(firestoreDB, "settings", "tampilan"), (docSnap) => {
            if (docSnap.exists()) {
                window.appSettings = docSnap.data();
                if(window.appSettings.bg) {
                    document.body.style.backgroundImage = `url(${window.appSettings.bg})`;
                }
                window.render();
            }
        });

        onSnapshot(collection(firestoreDB, "patients"), (snapshot) => {
            window.db.patients = [];
            snapshot.forEach((docSnap) => window.db.patients.push(docSnap.data()));
            window.db.patients.sort((a, b) => {
                const val = risk => risk === 'KRST' ? 3 : risk === 'KRT' ? 2 : 1;
                return val(b.risk) - val(a.risk);
            });
            if (window.currentPatient) window.currentPatient = window.db.patients.find(p => p.rm === window.currentPatient.rm) || null;
            window.render(); 
        });

        onSnapshot(collection(firestoreDB, "education"), (snapshot) => {
            window.db.education = [];
            snapshot.forEach((docSnap) => window.db.education.push({ id: docSnap.id, ...docSnap.data() }));
            window.db.education.sort((a, b) => b.timestamp - a.timestamp);
            if(window.view === 'pasienDashboard' || window.activeBidanTab === 'edukasi') window.render();
        });

        window.getFullRisk = function(riskCode) {
            if(riskCode === 'KRR') return 'KRR - Kehamilan Risiko Rendah';
            if(riskCode === 'KRT') return 'KRT - Kehamilan Risiko Tinggi';
            if(riskCode === 'KRST') return 'KRST - Kehamilan Risiko Sangat Tinggi';
            return riskCode;
        }

        window.hitungUsiaKehamilan = function(hpht) {
            if (!hpht) return { text: "Belum diset", hpl: "-" };
            const hphtDate = new Date(hpht);
            const today = new Date();
            const diffTime = Math.abs(today - hphtDate);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const weeks = Math.floor(diffDays / 7);
            const days = diffDays % 7;
            const hplDate = new Date(hphtDate);
            hplDate.setDate(hplDate.getDate() + 280);
            return { text: `${weeks} Minggu ${days} Hari`, hpl: hplDate.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) };
        }

        window.getYoutubeID = function(url) {
            let id = '';
            url = url.replace(/(>|<)/gi,'').split(/(vi\/|v=|\/v\/|youtu\.be\/|\/embed\/)/);
            if(url[2] !== undefined) id = url[2].split(/[^0-9a-z_\-]/i)[0]; else id = url;
            return id;
        }

        window.handleSettingUpload = function(event, type) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = e => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = async () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = type === 'bg' ? 1920 : 400; 
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const base64 = canvas.toDataURL('image/jpeg', type === 'bg' ? 0.85 : 0.9);
                    
                    try {
                        await setDoc(doc(firestoreDB, "settings", "tampilan"), { [type]: base64 }, { merge: true });
                        alert(type === 'bg' ? "Background berhasil diperbarui!" : "Logo berhasil diperbarui!");
                    } catch(err) { alert("Gagal mengupload pengaturan."); }
                }
            }
        }

        window.handleImageUpload = function(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = e => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    window.tempImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('imgPreview').src = window.tempImageBase64;
                    document.getElementById('imgPreviewBox').classList.remove('hidden');
                }
            }
        }

        window.DOKTER_LIST = ['dr. Wiasni Aprilia, Sp.Og', 'dr. Abdul Malik Yoga Fathori, Sp.Og'];

        window.normalizePhone = function(hp) {
            let d = String(hp || '').replace(/\D/g, '');
            if (d.startsWith('0')) d = '62' + d.substring(1);
            else if (d.startsWith('8')) d = '62' + d;
            return d;
        }
        window.sendWAFree = function(hp, nama) {
            const phone = window.normalizePhone(hp);
            if (!phone) return alert('Nomor WhatsApp pasien belum diisi.');
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent('Halo Bunda ' + nama + ', ')}`, '_blank');
        }
        window.sendWAReminder = function(hp, nama, tanggal, jam) {
            const phone = window.normalizePhone(hp);
            if (!phone) return alert('Nomor WhatsApp pasien belum diisi.');
            let tglText = tanggal || '-';
            if (tanggal && /^\d{4}-\d{2}-\d{2}$/.test(tanggal)) {
                tglText = new Date(tanggal + 'T00:00:00').toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            }
            const jamText = jam ? jam.replace(':', '.') + ' WIB' : '-';
            const msg = `Halo Bunda ${nama}, salam hangat dari Poli Obsgyn RSUD Kebayoran Baru.\n\nKami ingin mengingatkan kembali jadwal kontrol kehamilan Bunda yang akan dilaksanakan pada:\n📅 Hari/Tanggal: ${tglText}\n⏰ Jam: ${jamText}\n\nMohon untuk membawa kartu identitas/kartu berobat dan buku KIA (buku pink) Bunda ya. Jika Bunda berhalangan hadir, mohon informasikan kepada kami melalui pesan ini.\n\nSampai jumpa besok, Bunda! Sehat selalu untuk Bunda dan calon buah hati.`;
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        window.sendWAPatient = function(rm) {
            const p = window.db.patients.find(x => String(x.rm) === String(rm));
            if (!p) return alert('Data pasien tidak ditemukan.');
            const v = p.visits && p.visits.length > 0 ? p.visits[p.visits.length - 1] : null;
            if (!v || !v.nextDate) {
                if (!confirm('Jadwal kontrol selanjutnya belum diisi untuk pasien ini. Tetap kirim pesan pengingat?')) return;
            }
            window.sendWAReminder(p.hp, p.name, v ? v.nextDate : '', v ? v.nextTime : '');
        }

        const app = document.getElementById('app');

        window.navigate = function(targetView, data = null) {
            window.view = targetView;
            if (data) window.currentPatient = typeof data === 'string' ? window.db.patients.find(p => p.rm === data) : data;
            window.render(); window.scrollTo(0, 0);
        }

        window.setBidanTab = function(tabName) { window.activeBidanTab = tabName; window.renderBidanDashboard(); }
        window.setTab = function(tabName) { window.activeTab = tabName; window.renderPasienDashboard(); }
        window.render = function() {
            app.classList.remove('bidan-wide', 'bidan-mid');
            if (window.view === 'bidanDashboard') app.classList.add('bidan-wide');
            else if (window.view === 'patientDetail' || window.view === 'editPatient') app.classList.add('bidan-mid');
            if (window.view === 'login') window.renderLogin();
            else if (window.view === 'bidanDashboard') window.renderBidanDashboard();
            else if (window.view === 'patientDetail') window.renderPatientDetail();
            else if (window.view === 'editPatient') window.renderEditPatient();
            else if (window.view === 'pasienDashboard') window.renderPasienDashboard();
        }

        window.renderLogin = function() {
            let logoSrc = window.appSettings.logo ? window.appSettings.logo : 'https://cdn-icons-png.flaticon.com/512/3004/3004451.png';
            app.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-8 bg-gradient-to-b from-teal-50/90 to-white/90">
                    <div class="w-32 h-32 rounded-full flex items-center justify-center mb-4 shadow-xl overflow-hidden border-4 border-teal-200 bg-white">
                        <img src="${logoSrc}" alt="Logo" class="w-full h-full object-cover">
                    </div>
                    <h1 class="text-3xl font-extrabold text-teal-700 tracking-tight text-center leading-tight mb-1 drop-shadow-sm">Bunda Fit & Ready</h1>
                    <p class="text-teal-600 mb-8 text-center text-[10px] uppercase tracking-widest font-bold">RSUD Kebayoran Baru</p>
                    
                    <div class="w-full space-y-5">
                        <div class="bg-white/80 backdrop-blur p-5 rounded-2xl shadow-[0_0_15px_rgba(0,0,0,0.05)] border border-teal-100">
                            <h3 class="font-bold text-slate-700 mb-3 flex items-center gap-2"><i class="fas fa-user-injured text-teal-500"></i> Masuk Pasien</h3>
                            <input type="text" id="loginRM" placeholder="No Rekam Medis (RM)" class="w-full border border-slate-200 p-3 rounded-xl mb-3 focus:ring-2 focus:ring-teal-400 outline-none transition bg-white/50">
                            <button onclick="loginPasien()" class="w-full bg-teal-500 text-white font-bold py-3 rounded-xl hover:bg-teal-600 transition shadow-md">Cek Jadwal & Riwayat</button>
                        </div>
                        <div class="flex items-center text-slate-400 text-sm">
                            <div class="flex-1 border-t border-slate-300"></div><span class="px-3">Atau</span><div class="flex-1 border-t border-slate-300"></div>
                        </div>
                        <button onclick="loginBidan()" class="w-full bg-slate-800 text-white font-bold py-3 rounded-xl hover:bg-slate-900 transition shadow-md flex items-center justify-center gap-2"><i class="fas fa-user-nurse text-teal-400"></i> Masuk sebagai Bidan</button>
                    </div>
                </div>
            `;
        }

        window.loginBidan = function() {
            const inputPin = prompt("🔒 Masukkan Password Bidan:");
            if (inputPin === "Poliobsgyn2017") window.navigate('bidanDashboard');
            else if (inputPin !== null) alert("❌ Password Salah! Akses ditolak.");
        }

        window.loginPasien = function() {
            const rm = document.getElementById('loginRM').value;
            const patient = window.db.patients.find(p => p.rm === rm);
            if (patient) window.navigate('pasienDashboard', patient);
            else alert('Nomor RM tidak ditemukan di database.');
        }

        window.renderBidanDashboard = function() {
            app.classList.remove('bidan-mid'); app.classList.add('bidan-wide');
            let contentHTML = '';

            if (window.activeBidanTab === 'daftar') {
                let patientList = window.db.patients.map(p => {
                    const badgeColor = p.risk === 'KRST' ? 'bg-red-500' : p.risk === 'KRT' ? 'bg-yellow-500' : 'bg-green-500';
                    return `
                        <div onclick="navigate('patientDetail', '${p.rm}')" class="bg-white p-4 mb-3 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between cursor-pointer hover:border-teal-300">
                            <div class="flex-1">
                                <h3 class="font-bold text-slate-800 text-lg">${p.name}</h3>
                                <div class="text-xs text-slate-500 mt-1"><span class="bg-slate-100 px-2 py-0.5 rounded mr-2">RM: ${p.rm}</span>G${p.g}P${p.p}A${p.a}</div>
                                <div class="text-xs text-slate-500 mt-1"><i class="fab fa-whatsapp text-teal-600 mr-1"></i>${p.hp || '<span class="italic text-slate-400">No WA belum diisi</span>'}</div>
                                <div class="text-xs text-slate-500 mt-1"><i class="fas fa-user-md text-teal-600 mr-1"></i>${p.dokter || '<span class="italic text-slate-400">Dokter belum dipilih</span>'}</div>
                            </div>
                            <div class="flex flex-col items-end gap-2">
                                <span class="${badgeColor} text-white text-[10px] font-bold px-2 py-1 rounded-full shadow-sm">${p.risk}</span>
                                <button onclick="event.stopPropagation(); sendWAPatient('${p.rm}')" class="text-teal-600 bg-teal-50 w-8 h-8 rounded-full flex items-center justify-center hover:bg-teal-100"><i class="fab fa-whatsapp"></i></button>
                            </div>
                        </div>
                    `;
                }).join('');

                contentHTML = `
                  <div class="desk-cols">
                   <div class="desk-side">
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6">
                        <h3 class="font-bold text-slate-700 mb-4 border-b pb-2"><i class="fas fa-user-plus text-teal-500 mr-2"></i>Registrasi Pasien Baru</h3>
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <div class="col-span-2"><input type="text" id="newName" placeholder="Nama Lengkap Pasien" class="w-full border p-2 rounded-lg text-sm bg-slate-50"></div>
                            <div><input type="text" id="newRM" placeholder="No RM" class="w-full border p-2 rounded-lg text-sm bg-slate-50"></div>
                            <div><input type="number" id="newHP" placeholder="No WhatsApp" class="w-full border p-2 rounded-lg text-sm bg-slate-50"></div>
                        </div>
                        <div class="grid grid-cols-3 gap-2 mb-3">
                            <input type="number" id="newG" placeholder="G" class="border p-2 rounded-lg text-sm text-center bg-slate-50">
                            <input type="number" id="newP" placeholder="P" class="border p-2 rounded-lg text-sm text-center bg-slate-50">
                            <input type="number" id="newA" placeholder="A" class="border p-2 rounded-lg text-sm text-center bg-slate-50">
                        </div>
                        <div class="mb-3">
                            <label class="text-[10px] font-bold text-slate-500 uppercase">HPHT (Hari Pertama Haid Terakhir)</label>
                            <input type="date" id="newHPHT" class="w-full border p-2 rounded-lg text-sm bg-slate-50 mt-1">
                        </div>
                        <select id="newDokter" class="w-full border p-2 rounded-lg text-sm font-semibold mb-3 bg-slate-50">
                            <option value="">-- Pilih Dokter --</option>
                            ${window.DOKTER_LIST.map(d => `<option value="${d}">${d}</option>`).join('')}
                        </select>
                        <select id="newRisk" class="w-full border p-2 rounded-lg text-sm font-semibold mb-4 bg-slate-50">
                            <option value="KRR">KRR - Risiko Rendah</option>
                            <option value="KRT">KRT - Risiko Tinggi</option>
                            <option value="KRST">KRST - Risiko Sangat Tinggi</option>
                        </select>
                        <button onclick="addPatient()" class="w-full bg-slate-800 text-white font-bold py-3 rounded-xl hover:bg-slate-700 shadow-md">Simpan Pasien</button>
                    </div>
                   </div>
                   <div>
                    <h3 class="font-bold text-slate-700 mb-3 text-sm uppercase tracking-wider">Daftar Pasien</h3>
                    <div class="desk-grid">${patientList || '<p class="text-center text-slate-400 text-sm italic py-4">Belum ada data pasien.</p>'}</div>
                   </div>
                  </div>
                `;
            } 
            else if (window.activeBidanTab === 'jadwal') {
                const todayStr = new Date().toISOString().split('T')[0];
                const todayMonthStr = todayStr.substring(0, 7);
                
                let mode = document.getElementById('filterMode') ? document.getElementById('filterMode').value : 'hari';
                let filterDate = document.getElementById('filterDate') ? document.getElementById('filterDate').value : todayStr;
                let filterMonth = document.getElementById('filterMonth') ? document.getElementById('filterMonth').value : todayMonthStr;
                
                let schedules = [];
                window.db.patients.forEach(p => {
                    if(p.visits.length > 0) {
                        const lastVisit = p.visits[p.visits.length - 1];
                        if(lastVisit.attendance === 'Menunggu') {
                            if (mode === 'hari' && lastVisit.nextDate === filterDate) schedules.push({...p, lastVisit});
                            else if (mode === 'bulan' && lastVisit.nextDate.startsWith(filterMonth)) schedules.push({...p, lastVisit});
                        }
                    }
                });

                schedules.sort((a,b) => new Date(a.lastVisit.nextDate) - new Date(b.lastVisit.nextDate));

                let scheduleHTML = schedules.map(p => {
                    return `
                    <div class="bg-white border-l-4 border-teal-500 p-4 mb-3 rounded-xl shadow-sm">
                        <div class="flex justify-between items-start mb-2">
                            <div onclick="navigate('patientDetail', '${p.rm}')" class="cursor-pointer flex-1">
                                <h3 class="font-bold text-slate-800">${p.name}</h3>
                                <p class="text-[10px] font-bold text-teal-600 mb-1"><i class="far fa-calendar-alt"></i> Tgl: ${p.lastVisit.nextDate}${p.lastVisit.nextTime ? ` • Jam: ${p.lastVisit.nextTime}` : ''}</p>
                                <p class="text-xs text-slate-500 mt-0.5">RM: ${p.rm} • Kontrol ANC Ke-${(parseInt(p.lastVisit.anc) || p.visits.length) + 1} • Risiko: <span class="font-bold ${p.risk==='KRST'?'text-red-500':''}">${p.risk}</span></p>
                            </div>
                            <button onclick="sendWAPatient('${p.rm}')" class="bg-green-500 text-white text-[10px] font-bold px-3 py-2 rounded-lg hover:bg-green-600 shadow-sm flex items-center gap-1">
                                <i class="fab fa-whatsapp text-sm"></i> Kirim WA
                            </button>
                        </div>
                        <p class="text-sm text-slate-600 bg-slate-50 p-2 rounded border border-slate-100 mt-2"><i class="fas fa-clipboard-list mr-1 text-teal-600"></i> Plan: ${p.lastVisit.nextPlan}</p>
                    </div>
                `}).join('');

                contentHTML = `
                    <div class="bg-white p-4 rounded-xl shadow-sm mb-4 border border-teal-100">
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-xs font-bold text-slate-500">Filter Jadwal:</label>
                            <select id="filterMode" onchange="renderBidanDashboard()" class="text-xs border p-1 rounded font-bold text-teal-700 bg-teal-50">
                                <option value="hari" ${mode==='hari'?'selected':''}>Lihat Harian</option>
                                <option value="bulan" ${mode==='bulan'?'selected':''}>Lihat Bulanan</option>
                            </select>
                        </div>
                        ${mode === 'hari' ? 
                            `<input type="date" id="filterDate" value="${filterDate}" onchange="renderBidanDashboard()" class="w-full border p-2 rounded focus:ring-2 focus:ring-teal-200 outline-none text-sm">` :
                            `<input type="month" id="filterMonth" value="${filterMonth}" onchange="renderBidanDashboard()" class="w-full border p-2 rounded focus:ring-2 focus:ring-teal-200 outline-none text-sm">`
                        }
                    </div>
                    <div class="desk-grid">${scheduleHTML || `<div class="text-center py-8 text-slate-400"><i class="far fa-calendar-check text-4xl mb-2 text-teal-200"></i><p class="text-sm">Tidak ada jadwal kontrol ditemukan.</p></div>`}</div>
                `;
            } 
            else if (window.activeBidanTab === 'pemantauan') {
                let pList = [...window.db.patients];
                let pantauHTML = pList.map(p => {
                    const badgeRiskColor = p.risk === 'KRST' ? 'bg-red-500 text-white' : p.risk === 'KRT' ? 'bg-yellow-500 text-white' : 'bg-green-500 text-white';
                    
                    // ANC 1 = kunjungan pertama (otomatis Hadir karena pasien sudah diperiksa).
                    // Status kehadiran pada tiap kunjungan = status untuk kontrol BERIKUTNYA (ANC ke-N+1).
                    const boxColor = (att) => att === 'Hadir' ? 'bg-green-100 text-green-700 border-green-200' : (att === 'Tidak Hadir' ? 'bg-red-100 text-red-700 border-red-200' : 'bg-slate-100 text-slate-500 border-slate-200');
                    let boxes = [];
                    if (p.visits.length > 0) {
                        const firstAnc = parseInt(p.visits[0].anc) || 1;
                        boxes.push({ anc: firstAnc, att: 'Hadir' });
                        p.visits.forEach((v, i) => {
                            const curAnc = parseInt(v.anc) || (i + 1);
                            boxes.push({ anc: curAnc + 1, att: v.attendance });
                        });
                    }
                    let historyBoxes = boxes.map(b => {
                        return `<div class="inline-block px-2 py-1 text-[10px] font-bold rounded border ${boxColor(b.att)} mr-1 mb-1 shadow-sm whitespace-nowrap">ANC ${b.anc}: ${b.att}</div>`;
                    }).join('<i class="fas fa-arrow-right text-slate-300 text-[10px] mx-1"></i>');
                    const lastV = p.visits.length > 0 ? p.visits[p.visits.length - 1] : null;

            const date = document.getElementById('vDate').value;
            const diagnosis = document.getElementById('vDiag').value;
            if(!date || !diagnosis) return alert("Tanggal periksa dan Diagnosa wajib diisi!");

            let updatedVisits = [...window.currentPatient.visits];

            if (window.editingVisitIndex !== null) {
                let existing = updatedVisits[window.editingVisitIndex];
                updatedVisits[window.editingVisitIndex] = {
                    ...existing,
                    date: date,
                    anc: document.getElementById('vAnc').value || existing.anc,
                    trimester: document.getElementById('vTrimester').value,
                    diagnosis: diagnosis,
                    therapy: document.getElementById('vTherapy').value || '-',
                    penanganan: document.getElementById('vPenanganan').value,
                    nextDate: document.getElementById('vNextDate').value,
                    nextTime: document.getElementById('vNextTime').value,
                    nextPlan: document.getElementById('vNextPlan').value || '-',
                    penunjangFile: window.tempImageBase64 || existing.penunjangFile
                };
                window.editingVisitIndex = null;
            } else {
                const attEl = document.getElementById('vAttendance');
                if(attEl && updatedVisits.length > 0) {
                    updatedVisits[updatedVisits.length - 1].attendance = attEl.value;
                }

                // Tentukan status kehadiran kunjungan baru: 
                // Jika ini kunjungan pertama (visits kosong), otomatis 'Hadir'. Jika kunjungan berikutnya, awal statusnya 'Menunggu'.
                let defaultAttendance = updatedVisits.length === 0 ? 'Hadir' : 'Menunggu';

                    date: date, anc: document.getElementById('vAnc').value || (updatedVisits.length + 1),

                    diagnosis: diagnosis, therapy: document.getElementById('vTherapy').value || '-',

                    nextDate: document.getElementById('vNextDate').value,
                    nextTime: document.getElementById('vNextTime').value,
                    nextPlan: document.getElementById('vNextPlan').value || '-',
                    penunjangType: document.getElementById('vPenType').value,
                    penunjangFile: window.tempImageBase64 || null, attendance: defaultAttendance
                });
            }

                        <input type="text" id="editName" value="${p.name}" class="w-full border p-2 rounded-lg text-sm bg-slate-50 mb-3">
                        <label class="text-xs font-bold text-slate-500">No Rekam Medis (Tidak bisa diubah)</label>
                        <input type="text" value="${p.rm}" disabled class="w-full border p-2 rounded-lg text-sm bg-slate-200 mb-3 text-slate-500">
                        <label class="text-xs font-bold text-slate-500">No WhatsApp</label>
                        <input type="text" id="editHP" value="${p.hp}" class="w-full border p-2 rounded-lg text-sm bg-slate-50 mb-3">
                        
                        <label class="text-xs font-bold text-slate-500">Gravida (G P A)</label>
                        <div class="grid grid-cols-3 gap-2 mb-3">
                            <input type="number" id="editG" value="${p.g}" class="border p-2 rounded-lg text-sm text-center bg-slate-50">
                            <input type="number" id="editP" value="${p.p}" class="border p-2 rounded-lg text-sm text-center bg-slate-50">
                            <input type="number" id="editA" value="${p.a}" class="border p-2 rounded-lg text-sm text-center bg-slate-50">
                        </div>
                        
                        <label class="text-xs font-bold text-slate-500">HPHT</label>
                        <input type="date" id="editHPHT" value="${p.hpht}" class="w-full border p-2 rounded-lg text-sm bg-slate-50 mb-3">
                        
                        <label class="text-xs font-bold text-slate-500">Dokter</label>
                        <select id="editDokter" class="w-full border p-2 rounded-lg text-sm font-semibold mb-3 bg-slate-50">
                            <option value="">-- Pilih Dokter --</option>
                            ${window.DOKTER_LIST.map(d => `<option value="${d}" ${p.dokter===d?'selected':''}>${d}</option>`).join('')}
                        </select>

                        <label class="text-xs font-bold text-slate-500">Risiko Kehamilan</label>
                        <select id="editRisk" class="w-full border p-2 rounded-lg text-sm font-semibold mb-6 bg-slate-50">
                            <option value="KRR" ${p.risk==='KRR'?'selected':''}>KRR - Risiko Rendah</option>
                            <option value="KRT" ${p.risk==='KRT'?'selected':''}>KRT - Risiko Tinggi</option>
                            <option value="KRST" ${p.risk==='KRST'?'selected':''}>KRST - Risiko Sangat Tinggi</option>
                        </select>
                        <button onclick="saveEditPatient()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 shadow-md">Simpan Perubahan</button>
                    </div>
                </div>
            `;
        }

        window.saveEditPatient = async function() {
            try {
                await updateDoc(doc(firestoreDB, "patients", window.currentPatient.rm), {
                    name: document.getElementById('editName').value, hp: document.getElementById('editHP').value,
                    g: document.getElementById('editG').value, p: document.getElementById('editP').value, a: document.getElementById('editA').value,
                    hpht: document.getElementById('editHPHT').value, risk: document.getElementById('editRisk').value,
                    dokter: document.getElementById('editDokter').value,
                });
                alert("Perubahan data pasien berhasil disimpan!");
                window.navigate('patientDetail');
            } catch(e) { alert("Gagal menyimpan perubahan."); }
        }

        window.renderPasienDashboard = function() {
            const p = window.currentPatient;
            const latest = p.visits.length > 0 ? p.visits[p.visits.length - 1] : null;
            const dataHamil = window.hitungUsiaKehamilan(p.hpht);
            const fullRisk = window.getFullRisk(p.risk);

            let riwayatHTML = p.visits.map((v) => `
                <div class="bg-white p-4 rounded-xl shadow-sm mb-4 border border-slate-200 hover:border-teal-300 transition">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-2 mb-3">
                        <span class="font-bold text-slate-800"><i class="fas fa-stethoscope text-teal-500 mr-2"></i> ${v.date}</span>
                        <div class="text-right">
                            <span class="text-xs bg-teal-100 text-teal-800 px-2 py-1 rounded font-bold shadow-sm inline-block mb-1">Kunjungan ANC Ke-${v.anc}</span>
                            <div class="text-[10px] font-bold text-green-600">Hadir</div>
                        </div>
                    </div>
                    <p class="text-sm text-slate-700 mb-1"><span class="font-semibold text-slate-500">Diagnosa:</span> ${v.diagnosis}</p>
                    <p class="text-sm text-slate-700 mb-1"><span class="font-semibold text-slate-500">Terapi:</span> ${v.therapy}</p>
                    <p class="text-sm text-slate-700 mb-3"><span class="font-semibold text-slate-500">Status Penanganan:</span> <span class="font-bold text-teal-600">${v.penanganan || '-'}</span></p>
                    
                    ${v.penunjangFile ? `
                        <div class="mt-3 bg-slate-50 p-2 rounded-lg border border-slate-200">
                            <p class="text-xs font-bold text-slate-600 mb-2"><i class="fas fa-notes-medical text-teal-500 mr-1"></i> Hasil ${v.penunjangType}:</p>
                            <img src="${v.penunjangFile}" class="w-full rounded border border-slate-200">
                        </div>
                    ` : ''}
                </div>
            `).reverse().join('');

            let dbEdukasiHTML = window.db.education.map(e => {
                const ytid = window.getYoutubeID(e.link);
                return `
                <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 mb-4">
                    <h4 class="font-bold text-slate-800 text-sm mb-2 px-1">${e.title}</h4>
                    <a href="${e.link}" target="_blank" class="block aspect-video bg-slate-200 rounded-lg flex items-center justify-center text-slate-400 overflow-hidden relative cursor-pointer group shadow-inner">
                        <img src="https://img.youtube.com/vi/${ytid}/hqdefault.jpg" class="w-full h-full object-cover opacity-80 group-hover:scale-105 transition duration-300" onerror="this.src='https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?q=80&w=600&auto=format&fit=crop'" />
                        <div class="absolute inset-0 bg-black bg-opacity-20 group-hover:bg-opacity-30 transition"></div>
                        <div class="absolute flex flex-col items-center">
                            <i class="fab fa-youtube text-5xl text-red-600 drop-shadow-lg group-hover:scale-110 transition mb-1"></i>
                            <span class="text-white text-[10px] font-bold drop-shadow-md bg-black/60 px-2 py-1 rounded">Putar di YouTube</span>
                        </div>
                    </a>
                </div>
                `;
            }).join('');

            let edukasiHTML = `
                <div class="space-y-4">
                    <div class="bg-teal-50 border border-teal-200 p-5 rounded-xl mb-6 text-center shadow-sm">
                        <i class="fab fa-youtube text-4xl text-red-600 mb-2 drop-shadow-sm"></i>
                        <h4 class="font-bold text-slate-800 text-base mb-1">Edukasi RSUD Kebayoran Baru</h4>
                        <p class="text-xs text-slate-600 mb-4 px-2">Kunjungi channel resmi kami untuk informasi medis terkini.</p>
                        <a href="https://www.youtube.com/@RSUDKebayoranBaru" target="_blank" class="inline-block w-full bg-red-600 text-white font-bold text-sm px-4 py-3 rounded-xl hover:bg-red-700 transition shadow-md">
                            Buka Channel YouTube
                        </a>
                    </div>
                    <h3 class="font-bold text-slate-700 text-sm mb-3 border-b pb-1">Video Rekomendasi Bidan</h3>
                    ${dbEdukasiHTML || '<p class="text-xs text-slate-400 text-center italic">Belum ada video rekomendasi.</p>'}
                </div>
            `;

            let logoSrc = window.appSettings.logo ? window.appSettings.logo : 'https://cdn-icons-png.flaticon.com/512/3004/3004451.png';
            
            app.innerHTML = `
                <div class="bg-gradient-to-br from-teal-500 via-teal-600 to-teal-700 text-white p-6 rounded-b-[2rem] shadow-lg relative overflow-hidden">
                    <div class="absolute top-0 right-0 opacity-10"><i class="fas fa-leaf text-[10rem] -mt-10 -mr-10"></i></div>
                    <div class="relative z-10 flex justify-between items-start mb-5">
                        <div class="flex gap-3 items-center">
                            <div class="w-12 h-12 bg-white rounded-full p-0.5 shadow-md overflow-hidden border-2 border-white/30 flex-shrink-0 bg-white">
                                <img src="${logoSrc}" class="w-full h-full object-cover">
                            </div>
                            <div>
                                <p class="text-teal-100 text-xs font-medium uppercase tracking-wider mb-0.5">Halo Bunda,</p>
                                <h2 class="font-bold text-xl leading-tight">${p.name}</h2>
                            </div>
                        </div>
                        <button onclick="navigate('login')" class="text-xs bg-white/20 hover:bg-white/30 px-3 py-2 rounded-lg transition backdrop-blur-sm shadow-sm"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                    
                    <div class="relative z-10 grid grid-cols-2 gap-2 mt-4 bg-black/10 p-3 rounded-xl border border-white/10 backdrop-blur-sm mb-2">
                        <div><p class="text-[10px] text-teal-200 uppercase font-bold tracking-wider">Usia Kehamilan</p><p class="font-bold text-sm text-white">${dataHamil.text}</p></div>
                        <div><p class="text-[10px] text-teal-200 uppercase font-bold tracking-wider">Perkiraan Lahir</p><p class="font-bold text-sm text-white">${dataHamil.hpl}</p></div>
                    </div>
                    <div class="relative z-10 bg-black/10 px-3 py-1.5 rounded border border-white/10 backdrop-blur-sm inline-block">
                        <p class="text-[10px] text-teal-200 uppercase font-bold tracking-wider">Status Risiko Kandungan</p>
                        <p class="font-bold text-sm text-white">${fullRisk}</p>
                    </div>
                </div>
                
                <div class="p-5 flex-1 overflow-y-auto bg-white/80 backdrop-blur-sm">
                    
                    <a href="https://chat.whatsapp.com/LQgswwT95X7IKAhrW0MAjO?mode=gi_t" target="_blank" class="bg-green-500 text-white p-4 rounded-2xl shadow-md border border-green-400 mb-6 flex items-center justify-between group hover:bg-green-600 transition">
                        <div class="flex items-center gap-3">
                            <div class="bg-white/20 w-10 h-10 rounded-full flex items-center justify-center"><i class="fab fa-whatsapp text-2xl"></i></div>
                            <div><h3 class="font-bold text-sm">Grup WA Ibu Hamil</h3><p class="text-[10px] text-green-100">RSUD Kebayoran Baru</p></div>
                        </div>
                        <i class="fas fa-chevron-right opacity-50 group-hover:opacity-100 group-hover:translate-x-1 transition"></i>
                    </a>

                    <div class="bg-white rounded-2xl shadow-[0_0_20px_rgba(0,0,0,0.04)] border border-teal-200 p-5 mb-6 relative overflow-hidden">
                        <div class="absolute -right-6 -top-6 w-24 h-24 bg-teal-50 rounded-full z-0 opacity-70"></div>
                        <div class="relative z-10">
                            <p class="text-xs text-teal-600 font-bold uppercase mb-2 tracking-wider flex items-center"><i class="far fa-calendar-alt mr-2 text-lg"></i> Jadwal Kontrol Ulang</p>
                            <h3 class="text-2xl font-extrabold text-slate-800">${latest && latest.nextDate ? latest.nextDate : 'Belum Dijadwalkan'}</h3>
                            <div class="mt-3 inline-block bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-lg">
                                <p class="text-sm font-medium text-slate-600"><i class="fas fa-clipboard-list text-teal-500 mr-1.5"></i> Plan: ${latest && latest.nextPlan ? latest.nextPlan : '-'}</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex border-b border-slate-200 mb-5">
                        <button onclick="setTab('riwayat')" class="flex-1 pb-3 text-sm font-bold transition ${window.activeTab === 'riwayat' ? 'text-teal-600 border-b-2 border-teal-600' : 'text-slate-400 hover:text-slate-600'}">Riwayat & Hasil</button>
                        <button onclick="setTab('edukasi')" class="flex-1 pb-3 text-sm font-bold transition ${window.activeTab === 'edukasi' ? 'text-teal-600 border-b-2 border-teal-600' : 'text-slate-400 hover:text-slate-600'}">Video Edukasi</button>
                    </div>
                    
                    <div class="pb-6">${window.activeTab === 'riwayat' ? (riwayatHTML || '<div class="text-center py-8"><i class="fas fa-folder-open text-4xl text-slate-200 mb-3"></i><p class="text-sm text-slate-400">Belum ada riwayat medis.</p></div>') : edukasiHTML}</div>
                </div>
            `;
        }
    </script>
</body>
</html>
